# Manual fallback for the Windows Task Scheduler job on the maintainer's PC
# (task "NHIT ETC Data Refresh", monthly on the 15th), which is the real
# scheduler. Both run scripts/update_and_publish.py, which is idempotent
# (period-based diff against the repo), so running this by hand is safe at
# any time.
#
# The schedule is deliberately removed. ihmcl.co.in 403-blocks GitHub's
# datacenter IP ranges — confirmed 2026-07-02 via workflow_dispatch: 403 even
# with a Chrome UA. A cron here could therefore only ever fail, emailing the
# maintainer every month about a job that cannot succeed. Kept dispatch-only
# so it is one click away if IHMCL ever stops blocking; restore the cron then:
#   schedule:
#     - cron: '23 4 15 * *' # 04:23 UTC on the 15th ~= 09:53 IST
name: Monthly ETC data update

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: etc-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150 # full JSON rebuild re-parses every PDF
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Crawl IHMCL, rebuild JSON, publish
        run: python scripts/update_and_publish.py
